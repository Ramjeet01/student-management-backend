
# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server Configuration
# ===============================

server.port=${PORT:8080}

# ===============================
# JWT Configuration
# ===============================

jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:ramjeetyadav}
jwt.expiry=${JWT_EXPIRY:900}


#Resend
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.access=TRACE
logging.level.org.springframework.security.authorization=TRACE
logging.level.org.springframework.security.oauth2.server.resource=TRACE